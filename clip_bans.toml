# 클립금지 장부 — BJ가 2차 배포(유튜브 합본)를 막은 VOD/곡.
#
# 여기 적힌 건 `db.youtube_block_reason`이 업로드 후보에서 거른다. 타임스탬프(SOOP 딥링크)는
# 계속 제공되므로 `performances` 행은 지우지 않는다 — 막는 건 영상뿐이다.
# 자세한 배경과 형식은 src/soopts/clip_ban.py 모듈 docstring 참고.
#
# 적는 규칙:
#   - `reason` 필수. 사유 없는 금지는 나중에 풀어도 되는지 판단할 수 없다(파서가 거부한다).
#   - `evidence`에 근거를 그대로 인용한다 — 팬 타임라인의 `[클립금지]` 태그 원문이나
#     전사문의 BJ 육성(+초). 나중에 사람이 다시 판단할 때 이 인용만 보고 되짚을 수 있어야 한다.
#   - 곡 하나만 금지여도 그 VOD 전체가 업로드에서 빠진다(합본은 한 영상이라 부분 제외 불가).
#   - 푸는 것도 사람 판단이다. 실제로 풀었던 사례: perf 1447(192484717 홍연),
#     perf 1626(189233661 짝사랑) — 사용자가 올려도 된다고 해 등재하지 않았다.

